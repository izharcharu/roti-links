<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ร้านค้าของเรา</title>
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --bg-image:url("bg.jpg");
  --card:rgba(255,255,255,.88);
  --text:#1f2430;
  --accent:#ff6b35;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--card:rgba(24,26,33,.82);--text:#f4f5f8}
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{
  font-family:"Noto Sans Thai","Sarabun",system-ui,sans-serif;
  color:var(--text);
  background:#000 var(--bg-image) center 12%/min(140vw,760px) auto fixed no-repeat;
}
body::before{content:"";position:fixed;inset:0;background:linear-gradient(to bottom,rgba(0,0,0,.55),rgba(0,0,0,.85));z-index:0}
main{position:relative;z-index:1;max-width:480px;margin:0 auto;padding:40px 18px 48px;text-align:center}
.avatar{width:96px;height:96px;border-radius:50%;margin:0 auto 14px;border:3px solid #fff;background:var(--card) center/cover;display:grid;place-items:center;font-size:40px}
h1{margin:0;color:#fff;font-size:1.6rem;text-shadow:0 2px 8px rgba(0,0,0,.4)}
.sub{color:#fff;opacity:.9;margin:6px 0 26px;text-shadow:0 1px 6px rgba(0,0,0,.4)}
.links{display:flex;flex-direction:column;gap:12px}
a.link{
  display:flex;align-items:center;gap:14px;padding:15px 18px;border-radius:16px;
  background:var(--card);color:var(--text);text-decoration:none;font-weight:600;
  backdrop-filter:blur(8px);box-shadow:0 4px 14px rgba(0,0,0,.2);
  transition:transform .15s;
}
a.link:active{transform:scale(.98)}
a.link .ic{font-size:1.5rem;width:40px;height:40px;display:grid;place-items:center;flex:none}
a.link .ic img{width:40px;height:40px;object-fit:contain;border-radius:10px}
a.link .tx{flex:1;text-align:left}
a.link small{display:block;font-weight:400;opacity:.7;font-size:.8rem}
a.link .ar{opacity:.5}
footer{margin-top:28px;color:#fff;opacity:.7;font-size:.8rem}
</style>
</head>
<body>
<main>
  <div class="avatar" id="avatar" style="background-image:var(--bg-image)"></div>
  <h1 id="name">โรตี บังอาร์เดล</h1>
  <p class="sub" id="bio">สั่งโรตีได้ทุกช่องทาง กดเลือกร้านได้เลย</p>
  <div class="links" id="links"></div>
  <footer id="foot"></footer>
</main>
<script>
// แก้ข้อมูลตรงนี้ได้เลย (logo = ชื่อไฟล์โลโก้ที่อัปโหลดไว้โฟลเดอร์เดียวกับไฟล์นี้)
var CONFIG={
  name:"โรตี บังอาร์เดล",
  bio:"สั่งโรตีได้ทุกช่องทาง กดเลือกร้านได้เลย",
  links:[
    {icon:"🛒",logo:"shopee.png",title:"Shopee",url:"https://s.shopee.co.th/5fqOIRzhic"},
    {icon:"🎵",logo:"tiktok.png",title:"TikTok Shop",url:"https://www.tiktok.com/@myardel"},
    {icon:"💬",logo:"line.png",title:"LINE",url:"https://line.me/ti/p/qls9hjqwaB"},
    {icon:"📘",logo:"facebook.png",title:"Facebook",url:"https://www.facebook.com/share/1EBpoZCByH/"},
    {icon:"📞",logo:"phone.png",title:"โทร 080-716-5786",url:"tel:0807165786"}
  ]
};
document.getElementById("name").textContent=CONFIG.name;
document.getElementById("bio").textContent=CONFIG.bio;
document.title=CONFIG.name;
function tryLogo(ic,l){
  var base=l.logo.replace(/\.[^.]+$/,""),cap=base.charAt(0).toUpperCase()+base.slice(1),names=[l.logo],i=0;
  ["png","PNG","jpg","jpeg","webp","svg"].forEach(function(e){names.push(base+"."+e);names.push(cap+"."+e)});
  (function next(){
    if(i>=names.length)return;
    var im=new Image();im.alt=l.title;
    im.onload=function(){ic.textContent="";ic.appendChild(im)};
    im.onerror=next;im.src=names[i++];
  })();
}
var box=document.getElementById("links");
CONFIG.links.forEach(function(l){
  var a=document.createElement("a");
  a.className="link";a.href=l.url;a.target="_blank";a.rel="noopener";
  a.innerHTML='<span class="ic"></span><span class="tx"><span class="t"></span></span><span class="ar">›</span>';
  var ic=a.querySelector(".ic");
  ic.textContent=l.icon;
  if(l.logo)tryLogo(ic,l);
  a.querySelector(".t").textContent=l.title;
  box.appendChild(a);
});
</script>
</body>
</html>
